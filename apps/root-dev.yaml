apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-manager-dev-root
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  source:
    repoURL: https://github.com/aguchomattar/argocd-gitops.git
    targetRevision: main
    path: apps/dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true



