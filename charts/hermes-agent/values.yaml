replicaCount: 1

image:
  repository: ghcr.io/aguchomattar/hermes-agent
  tag: "v12"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

hostNetwork: true
dnsPolicy: Default

envFromSecrets:
  - hermes-secrets
  - telegram-creds

resources:
  requests:
    memory: "400Mi"
    cpu: "200m"
  limits:
    memory: "800Mi"
    cpu: "500m"
